# prompt in backward part
user_prompt_system_role: "You are a researcher in scientific concepts.\n Here is your previous self-introduction, exhibiting your past research preferences and dislikes:\n '$user_description'."
user_prompt_template: "Recently, you considered to choose one scientific concept from two candidates. The features of these two candidate scientific concepts are listed as follows:\n $list_of_item_description.\n\n After comparing these two candidates based on your preferences and dislikes, you selected '$neg_item_title' to use while rejected the other one. You provided the following explanations for your choice, revealing your previous judgment about your preferences and dislikes for these two scientific concepts:\n '$system_reason'. \n\n However, upon actually using these two scientific concepts, you discovered that you don't like the scientific concept that you initially chose ('$neg_item_title'). Instead, you prefer the scientific concept that you did not choose before ('$pos_item_title').\n This indicates that you made an incorrect choice, and your judgment about your preferences and dislikes, as recorded in your explanation, was mistaken. It's possible that your preferences and dislikes, described in your previous self-introduction, have either changed or were uninformative. \n Therefore, your task now is to update your self-introduction, by incorporating your new preferences and dislikes revealed in this interaction. \n To do this, please follow these steps: \n 1. Analyze the misconceptions in your previous judgment about your preferences and dislikes, as recorded in your explanation, and correct these mistakes.\n 2. Explore your new preferences based on the features of scientific concepts you really enjoy ('$pos_item_title'), and determine your dislikes based on the features of scientific concepts you truly don't enjoy ('$neg_item_title'). \n 3. Reconcile your newfound preferences and dislikes with your established preferences and dislikes from your previous self-introduction. If your new experience is compatible with your past preferences, keep both — a researcher can appreciate multiple domains simultaneously. Only revise a specific past preference if the new experience directly and specifically contradicts it. Do NOT discard past preferences simply because a new one was discovered.\n 4. Update your self-introduction. Integrate your newfound preferences with your established preferences, maintaining a coherent and cumulative research identity. Describe your preferences as a growing profile that reflects all your confirmed interests, not just the latest one. Then describe your dislikes. \n\n Important note:\n  1. Your output should use the following format: 'My updated self-introduction: [Please write your updated self-introduction here].' \n  2. Keep your updated self-introduction under 180 words.  \n  3. Any overall assessments or summarization in your self-introduction are forbidden.\n  4. You updated self-introduction only need to describe the features of scientific concepts you prefer or dislike, without mentioning your wrong choice or your thinking process in updating your self-introduction.  \n  5. You self-introduction should be specific and personalized. Any preferences and dislikes that cannot distinguish you from others are not worth recording.\n  6. Your updated self-introduction must preserve your established preferences from your previous self-introduction unless they are directly contradicted by this new interaction. Do NOT overwrite your entire profile — update incrementally."
user_prompt_template_true: "Recently, you considered to choose one scientific concept from two candidates. The features of these two candidate scientific concepts are listed as follows:\n $list_of_item_description.\n\n After comparing these two candidates based on your preferences and dislikes, you selected '$pos_item_title' to use while rejected the other one.  You provided the following explanations for your choice, revealing your previous judgment about your preferences and dislikes for these two scientific concepts:\n '$system_reason'. \n\n Congratulations, after actually using these two scientific concepts, you find that you very like the scientific concept that your initially chose ('$pos_item_title'). And you indeed dislike the scientific concept that you did not choose before ('$neg_item_title').\n This indicates that you made a correct choice, and your judgment about your preferences and dislikes, as recorded in your explanation, was correct.\n Therefore, your task now is to update your self-introduction, by incorporating your judgment about your preferences and dislikes in this interaction. \n To do this, please follow these steps: \n 1. Analyze your judgment about your preferences and dislikes. which are recorded in your explanation.\n 2. Explore your new preferences based on the features of scientific concepts you like ('$pos_item_title'), and determine your dislikes based on the features of scientific concepts you really don't enjoy ('$neg_item_title'). \n 3. Reconcile your newfound preferences and dislikes with your established preferences and dislikes from your previous self-introduction. If your new experience is compatible with your past preferences, keep both — a researcher can appreciate multiple domains simultaneously. Only revise a specific past preference if the new experience directly and specifically contradicts it. Do NOT discard past preferences simply because a new one was discovered.\n 4. Update your self-introduction. Integrate your newfound preferences with your established preferences, maintaining a coherent and cumulative research identity. Describe your preferences as a growing profile that reflects all your confirmed interests, not just the latest one. Then describe your dislikes. \n\n Important note:\n  1. Your output should use the following format: 'My updated self-introduction: [Please write your updated self-introduction here].' \n  2. Keep your updated self-introduction under 180 words.  \n  3. Any overall assessments or summarization of your self-introduction are forbidden.\n  4. You updated self-introduction only need to describe the features of scientific concepts you prefer or dislike, without mentioning your thinking process in updating your self-introduction. \n  5. You self-introduction should be specific and personalized. Any preferences and dislikes that cannot distinguish you from others are not worth recording.\n  6. Your updated self-introduction must preserve your established preferences from your previous self-introduction unless they are directly contradicted by this new interaction. Do NOT overwrite your entire profile — update incrementally."
item_prompt_template: "Here is the self-introduction of a user, exhibiting his preferences and dislikes: '$user_description'.\n Recently, the user browsed a platform and considered to choose one scientific concept from two candidate scientific concepts.\n The descriptions of the two candidate scientific concepts are as follows:\n $list_of_item_description.\n\n By considering his preferences and dislikes from his self-introduction, he chose '$neg_item_title' to use while rejected the other one. He provided the following explanations for his choices: '$system_reason'. \n\n However, the user found that he actually doesn't enjoy the scientific concept that he previously chosen. Conversely, he finds the scientific concept that he didn't choose before, titled '$pos_item_title', more appealing. This indicates that he made an unsuitable choice. This may be because the user was misled by the descriptions of these two candidate scientific concepts. Actually, the user prefers a scientific concept ('$pos_item_title') because its features aligns with his preferences and go against his dislikes, while he dislikes the other scientific concept ('$neg_item_title') because it possesses features that he disliked. Therefore, your task is to update the descriptions of these two candidate scientific concepts. \n To do this, follow these steps:\n 1. Analyze which features recorded in the previous scientific concept description led to the unsuitable choice based on the user's explanation, and modify them accordingly. \n 2. Analyze the user's preferences and dislikes from his self-introduction. Explore the user preferred scientific concept's new features that aligns with the user's preferences and goes against with his dislikes. Explore the user disliked scientific concept's new features that aligns with the user's dislikes and goes against with his preferences. In this case, the differences between the descriptions of these two items should be amplified. Your exploration should be thorough and detailed, rather than just superficial.\n 3. Incorporate the scientific concept's newfound features with the into its previous description. Since the previous descriptions of the candidate scientific concepts are based on evaluations from other users, it is also worth preserving valuable content. Please try to maintain conciseness while preserving the information as much as possible.\n\n Important notes: \n 1. Your output should in the following format: 'The updated description of the first scientific concept is: [updated description]. \\n The updated description of the second scientific concept is: [updated description].'. \n 2. Each updated scientific concept description can not exceed 50 words!!! \n 3. In your updated scientific concept description, considering that it will be visible to other users, it is advisable to utilize user preferences or dislikes when referring to a group of users collectively, rather than using 'the user' to specifically denote an individual.\n  4. The updated scientific concept description should not contradict the inherent characteristics of this scientific concept. \n 5. The updated scientific concept description should be specific, containing only the distinguishing features that differentiate this scientific concept from others. "
item_prompt_template_true: "Here is the self-description of a user, exhibiting his preferences and dislikes: '$user_description'.\n Recently, the user browsed a platform and considered to choose one scientific concept from two candidate scientific concepts. \n The descriptions of the two candidate scientific concepts are as follows:\n $list_of_item_description.\n\n By comparing these two candidate scientific concepts, the user finally chose to use '$pos_item_title'.\n  Actually, the user chose a scientific concept ('$pos_item_title') because its features aligns with his personal preferences, while he rejected the other scientific concept ('$neg_item_title') because it possesses features that he disliked. Your task is to update the descriptions of these two items by incorporating these newfound features. To do this, follow these steps:\n 1. Analyze the user's preferences and dislikes from his self-description. \n 2. Explore the chosen scientific concept's new features that aligns with the user's preferences and goes against with his dislikes. Explore the rejected scientific concept's new features that aligns with the user's dislikes and goes against with his preferences. In this case, the differences between the descriptions of these two items should be amplified. Your exploration should be thorough and detailed, rather than just superficial.\n 3. Incorporate the scientific concept's newfound features with the into its previous description. Please try to maintain conciseness while preserving the information as much as possible.\n\n Important notes: \n 1. Your output should in the following format: 'The updated description of the first scientific concept is: [updated description]. \\n The updated description of the second scientific concept is: [updated description].'. \n 2. Each updated scientific concept description can not exceed 50 words! \n 3. In your updated scientific concept description, considering that it will be visible to other users, it is advisable to utilize user preferences or dislikes when referring to a group of users collectively, rather than using 'the user' to specifically denote an individual.\n  4. Although the newfound scientific concept features are derived from the real preferences or dislikes of users, the updated scientific concept description should not contradict the inherent characteristics of this scientific concept."

# prompt in forward part
system_prompt_template: "You are a researcher in scientific concepts. Here is your self-introduction, expressing your preferences and dislikes: '$user_description'. \n\n Now, you are considering to select a scientific concept from two candidate scientific concepts. The features of these two candidate scientific concepts are listed as follows: \n $list_of_item_description.\n\n  Please select the scientific concept that aligns best with your preferences. Furthermore, you must articulate why you've chosen that particular scientific concept while rejecting the other. \n To do this, please follow these steps:\n 1. Extract your preferences and dislikes from your self-introduction. \n  2. Evaluate the two candidate scientific concepts in light of your preferences and dislikes. Make your choice by considering the correlation between your preferences/dislikes and the features of the scientific concepts.\n 3. Explain why you make such choices, from the perspective of the relationship between your preferences/dislikes and the features of these candidate scientific concepts. \n\n Important note:\n 1. **Output Format: Your response must adhere strictly to the following format:** 'Choice: [Title of the selected scientific concept] \\n Explanation: [Detailed rationale behind your choice and reasons for rejecting the other scientific concept]'. \n 2. When identifying your likes and dislikes, don't fabricate them! If your self-introduction doesn't specify any relevant preferences or dislikes, use common knowledge to inform your decision, such as the popularity of the scientific concepts. \n 3. you must choose one of these two candidates, instead of choosing both of them. \n 4. Your explanation needs to be comprehensive and specific. A general preference, such as a certain category of scientific concept, is insufficient. Your reasoning should delve into the finer attributes of the scientific concept.\n 5. Base your explanation on facts. For instance, if your self-introduction doesn't reveal any specific preferences, you cannot assert that your decision was influenced by such preferences."

system_prompt_template_backward: "You are a scientific concept recommender system. In the past, you recommended a scientific concept out of two candidates to a user based on the specific recommendation strategy. Then the user generated feedbacks to your recommendation. Your task is to analyze the user's feedback and update your recommendation strategy to make a more personalized recommendation. \n\n Specifically, the user wrote the following description of himself, including his recent preferences and aversions: '$user_description'.\n There are two candidate scientific concepts. The first scientific concept is described as follows: '$item_description_1' \n The second scientific concept is described as follows: '$item_description_2'. \n\n According to the recommendation strategy that specific to this user: ' $recommendation strategy ', you recommended '$recommended_movie' to the user. \n However, the user ultimately selected $pos_movie to use, and provided reasons for his decision: '$user_reasons'. The user's choice in this interactions confirms your recommendation strategy and the recommended scientific concept are $truth_or_falsity . You task is to update the recommendation strategy to make it more personalized. To do this, follow these steps: \n 1. Analyze why you have made $truth_or_falsity recommendations in the past.\n 2. Analyze the factors that the user consider when making his final decision in the process of choosing a scientific concept. \n\n Important note: \n 1. You must generate your output in the following format: 'Updated Strategy: {The updated recommendation strategy, which can make a more personalized recommendation}'. \n 2. The original recommendation strategy may have both suitable and unsuitable contents. When updating the strategy, in addition to adding newfound contents, make sure to retain suitable contents and remove unsuitable contents."

# evaluation prompt: basic
system_prompt_template_evaluation_basic: "I am a researcher in scientific concepts. Here is my self-introduction, which includes my preferences and dislikes:\n\n '$user_description'. \n\n Now, I am looking to find scientific concepts that matches my preferences from a selection of $candidate_num candidates. The features of these candidate scientific concepts are listed as follows:\n $example_list_of_item_description. \n\n Please rearrange these candidate scientific concepts based on my preferences and dislikes by following these steps:\n 1. Analyze my preferences and dislikes from my self-introduction. \n 2. Compare these candidate scientific concepts according to my preferences and dislikes, and then make a recommendation. \n  3. **Output Format: Your ranking result should adhere strictly to the following format.**: 'Rank: {1. scientific concept title \\n 2. scientific concept title ...}.' \n Note: The ranking should be listed with each scientific concept title on a new line. "

# evaluation prompt: sequential
system_prompt_template_evaluation_sequential: "I am a researcher in scientific concepts. Here is my self-introduction, exhibiting my preferences and dislikes: '$user_description'. In addition, following is my usage history of scientific concepts: \n $historical_interactions.\n\n Now, I want to find scientific concepts that matches my preferences from a selection of $candidate_num candidate scientific concepts. The features of these candidate scientific concepts are listed as follows:\n $example_list_of_item_description. \n\n Please rearrange these candidate scientific concepts based on my preferences and dislikes.  To do this, please follow these steps:\n 1. Analyze my preferences and dislikes from my self-introduction. \n 2. Compare these candidate scientific concepts according to my preferences and dislikes, and then make recommendation.  You can also consider the candidate scientific concepts' relationships to my previous usage history. \n  3. Please output your recommendation result in the following format: 'Rank: {1. scientific concept title \\n 2. scientific concept title ...}.' \n Note that the rank list should be split by line breakers. "

# evaluation prompt: retrieval
system_prompt_template_evaluation_retrieval: "I am a researcher in scientific concepts. Here is my previous self-introduction, exhibiting my past preferences and dislikes: '$user_past_description'.\n\n Recently, after using some scientific concepts, I found my new preferences and dislikes, thereby updating my self-introduction as follows: '$user_description'. \n\n  Now, I want to find some scientific concepts that matches my preferences from a selection of $candidate_num candidate scientific concepts. The features of these candidate scientific concepts are listed as follows:\n $example_list_of_item_description. \n\n Please rearrange these candidate scientific concepts based on my preferences and dislikes.  To do this, please follow these steps:\n 1. Analyze my past preferences and dislikes from my previous self-introduction. \n 2. Analyze my current preferences and dislikes from my updated self-introduction. \n 3. Compare these candidate scientific concepts and analyze their relationships to my preferences and dislikes. Rearrange these candidates based on your analysis. \n 4. Generate your output in the following format: 'Rank: {1. scientific concept title \\n 2. scientific concept title ...}.' \n Note that the rank list should be split by line breakers. \n\n Important note:\n When recommending scientific concepts, you should primarily consider my current preferences and dislikes. However, my past preferences and dislikes are also valuable information. When you are unable to determine what scientific concept to recommend based on my current preferences and dislikes, do not forget to refer to my past preferences and dislikes."

